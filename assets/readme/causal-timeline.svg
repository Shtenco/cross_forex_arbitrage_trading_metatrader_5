<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="436" viewBox="0 0 1300 436" role="img" aria-labelledby="title description"><title id="title">Lookahead error in backtest chronology</title><desc id="description">Current full-day signal and average price discrepancy influence a first-minute entry. Proposed correction uses only prior and current synchronized quotes and executes after the signal.</desc><rect width="1300" height="436" rx="16" fill="#0c1a29"/><text x="36" y="53" fill="#eef7fb" font-size="27" font-family="Arial,sans-serif" font-weight="700">TEMPORAL INTEGRITY / BACKTEST REVIEW</text><text x="44" y="111" fill="#efbc90" font-size="19" font-weight="700" font-family="Arial,sans-serif">PRESENT CODE / LOOKAHEAD</text><path d="M52 193H1242" stroke="#c99c77" stroke-width="4"/><g fill="#eac4a1" font-family="Arial,sans-serif" font-size="16"><circle cx="88" cy="193" r="8"/><circle cx="654" cy="193" r="8"/><circle cx="1208" cy="193" r="8"/><text x="54" y="230">First minute: entry</text><text x="520" y="230">Full-day mean spread</text><text x="1034" y="230">Any signal later today</text></g><path d="M1170 181Q617 89 100 181" stroke="#f0b784" stroke-width="3" stroke-dasharray="9 8" fill="none"/><text x="415" y="161" fill="#f0b784" font-family="Arial,sans-serif" font-size="16">Future daily data determines earlier trade</text><text x="44" y="297" fill="#71dfcd" font-size="19" font-weight="700" font-family="Arial,sans-serif">REQUIRED MODEL / CAUSAL EVENT STREAM</text><path d="M52 344H1242" stroke="#67cfbd" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="16" fill="#cbecdf"><circle cx="91" cy="344" r="8"/><circle cx="460" cy="344" r="8"/><circle cx="848" cy="344" r="8"/><circle cx="1188" cy="344" r="8"/><text x="52" y="379">Quotes arrive</text><text x="386" y="379">Signal at time t</text><text x="785" y="379">Orders after t</text><text x="1091" y="379">Actual fills</text></g><text x="45" y="418" fill="#93b4c6" font-family="Arial,sans-serif" font-size="14">Validation requires causal timestamps and no decision made using data from the future.</text></svg>