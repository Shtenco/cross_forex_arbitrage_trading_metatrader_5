<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="355" viewBox="0 0 1300 355" role="img" aria-labelledby="title description"><title id="title">Scientific validation gates</title><desc id="description">Route dimensions, time-correct quotes, executable bid ask, costs and partial fills, sealed out-of-sample replay, and reproducibility report.</desc><rect width="1300" height="355" rx="16" fill="#0a1726"/><text x="34" y="54" fill="#f1f7fd" font-family="Arial,sans-serif" font-size="26" font-weight="700">RESEARCH VALIDATION / ACCEPTANCE GATES</text><g font-family="Arial,sans-serif"><rect x="28" y="116" width="227" height="105" rx="10" fill="#173348" stroke="#70d7c5"/><text x="45" y="151" font-size="16" fill="#75e4d2">G1</text><text x="45" y="184" font-size="15" font-weight="bold" fill="#ecf4f9">DIMENSIONAL FX GRAPH</text><path d="M255 165h25" stroke="#70d7c5" stroke-width="2"/><rect x="281" y="116" width="227" height="105" rx="10" fill="#173348" stroke="#70d7c5"/><text x="298" y="151" font-size="16" fill="#75e4d2">G2</text><text x="298" y="184" font-size="15" font-weight="bold" fill="#ecf4f9">TIMESTAMP SYNC</text><path d="M508 165h25" stroke="#70d7c5" stroke-width="2"/><rect x="534" y="116" width="227" height="105" rx="10" fill="#173348" stroke="#dfb78d"/><text x="551" y="151" font-size="16" fill="#75e4d2">G3</text><text x="551" y="184" font-size="15" font-weight="bold" fill="#ecf4f9">EXECUTABLE BID / ASK</text><path d="M761 165h25" stroke="#70d7c5" stroke-width="2"/><rect x="787" y="116" width="227" height="105" rx="10" fill="#173348" stroke="#dfb78d"/><text x="804" y="151" font-size="16" fill="#75e4d2">G4</text><text x="804" y="184" font-size="15" font-weight="bold" fill="#ecf4f9">MULTI-LEG COSTS</text><path d="M1014 165h25" stroke="#70d7c5" stroke-width="2"/><rect x="1040" y="116" width="227" height="105" rx="10" fill="#173348" stroke="#dfb78d"/><text x="1057" y="151" font-size="16" fill="#75e4d2">G5</text><text x="1057" y="184" font-size="15" font-weight="bold" fill="#ecf4f9">SEALED OOS REPLAY</text><rect x="31" y="261" width="1238" height="58" rx="8" fill="#22303d" stroke="#657e90"/><text x="52" y="287" font-size="18" fill="#e6f1f5">ACCEPTANCE: measured and repeatable post-cost net opportunity, with explicit failures.</text><text x="52" y="309" font-size="14" fill="#aac0d0">No current source result is certified by these proposed gates.</text></g></svg>