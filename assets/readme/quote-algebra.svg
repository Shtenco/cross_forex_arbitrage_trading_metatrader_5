<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="535" viewBox="0 0 1300 535" role="img" aria-labelledby="title description"><title id="title">Synthetic exchange-rate algebra</title><desc id="description">Two correct FX rate formulas: common bridge currency requires multiplication; common quote requires division with executable bid/ask sides.</desc><rect width="1300" height="535" rx="16" fill="#0b1928"/><text x="38" y="51" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f3f7fa">SYNTHETIC FX / DIMENSIONAL ALGEBRA</text><text x="39" y="83" font-family="Arial,sans-serif" font-size="16" fill="#a9bfcd">A/B means units of B per one unit A. Executable side matters.</text><rect x="35" y="112" width="1230" height="168" rx="13" fill="#122f40" stroke="#67d8c7"/><text x="60" y="152" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#6be6d0">CASE 01 — CHAIN / MULTIPLICATION</text><g font-family="Arial,sans-serif" font-size="25" fill="#fff"><text x="60" y="198">AUD / USD</text><text x="280" y="198">×</text><text x="346" y="198">USD / CHF</text><text x="595" y="198">=</text><text x="660" y="198">AUD / CHF</text></g><path d="M60 217H872" stroke="#547d89"/><text x="60" y="252" font-family="Arial,sans-serif" font-size="18" fill="#c3dce6">synthetic BID = BID(AUDUSD) × BID(USDCHF)</text><text x="735" y="252" font-family="Arial,sans-serif" font-size="18" fill="#c3dce6">ASK = ASK × ASK</text><rect x="35" y="304" width="1230" height="179" rx="13" fill="#152f40" stroke="#d2b38f"/><text x="60" y="344" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#edc49f">CASE 02 — COMMON QUOTE / DIVISION</text><g font-family="Arial,sans-serif" font-size="25" fill="#fff"><text x="60" y="391">AUD / USD</text><text x="280" y="391">÷</text><text x="346" y="391">NZD / USD</text><text x="595" y="391">=</text><text x="660" y="391">AUD / NZD</text></g><path d="M60 410H872" stroke="#6a7284"/><text x="60" y="448" font-family="Arial,sans-serif" font-size="18" fill="#d8e3ec">synthetic BID = BID(AUDUSD) / ASK(NZDUSD)</text><text x="760" y="448" font-family="Arial,sans-serif" font-size="18" fill="#d8e3ec">ASK = ASK / BID</text><text x="43" y="515" font-family="Arial,sans-serif" font-size="14" fill="#8eaab9">SOURCE FINDING: CURRENT SCRIPT DIVIDES ALL 32 ROUTES; 14 ROUTES REQUIRE MULTIPLICATION.</text></svg>