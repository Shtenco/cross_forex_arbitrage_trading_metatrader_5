<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="445" viewBox="0 0 1300 445" role="img" aria-labelledby="title description"><title id="title">Executable arbitrage and no-arbitrage check</title><desc id="description">Correct cross-rate comparison between direct market bid/ask and executable synthetic bid/ask, followed by quotation freshness, depth, fees, and multi-leg fills.</desc><rect width="1300" height="445" rx="16" fill="#0a1827"/><text x="38" y="51" fill="#eff7ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">DIRECT MARKET VS EXECUTABLE SYNTHETIC MARKET</text><rect x="38" y="92" width="367" height="135" rx="10" fill="#173647" stroke="#56cfc0"/><text x="58" y="132" fill="#a3dfd3" font-family="Arial,sans-serif" font-size="20" font-weight="700">DIRECT AUD/NZD</text><text x="58" y="167" fill="#eff5f7" font-family="Arial,sans-serif" font-size="19">bid_direct, ask_direct</text><text x="58" y="198" fill="#9abac8" font-family="Arial,sans-serif" font-size="15">Contemporaneous executable book</text><rect x="452" y="92" width="407" height="135" rx="10" fill="#173647" stroke="#56cfc0"/><text x="473" y="132" fill="#a3dfd3" font-family="Arial,sans-serif" font-size="20" font-weight="700">SYNTHETIC AUD/NZD</text><text x="473" y="167" fill="#eff5f7" font-family="Arial,sans-serif" font-size="19">bid(AUDUSD)/ask(NZDUSD)</text><text x="473" y="198" fill="#eff5f7" font-family="Arial,sans-serif" font-size="19">ask(AUDUSD)/bid(NZDUSD)</text><rect x="907" y="92" width="354" height="135" rx="10" fill="#24303c" stroke="#d4a67b"/><text x="929" y="132" fill="#f0d0a8" font-family="Arial,sans-serif" font-size="20" font-weight="700">NET EDGE TEST</text><text x="929" y="166" fill="#f2f4f6" font-family="Arial,sans-serif" font-size="17">synth_bid &gt; direct_ask</text><text x="929" y="197" fill="#f2f4f6" font-family="Arial,sans-serif" font-size="17">direct_bid &gt; synth_ask</text><path d="M405 159H452M859 159H907" stroke="#6cd7c8" stroke-width="3"/><path d="M1085 227V279H649" stroke="#d6af83" stroke-width="3" fill="none"/><rect x="178" y="279" width="943" height="99" rx="10" fill="#173b3d" stroke="#79d8c2"/><text x="203" y="318" fill="#ecf9f6" font-family="Arial,sans-serif" font-size="20" font-weight="700">EXECUTION GATE</text><text x="203" y="348" fill="#a7dacc" font-family="Arial,sans-serif" font-size="18">Quote age  /  depth  /  commissions  /  slippage  /  leg fills  /  inventory</text><text x="37" y="419" fill="#dfb68c" font-family="Arial,sans-serif" font-size="16">Price inequality is a candidate signal, not a guaranteed realizable profit.</text></svg>